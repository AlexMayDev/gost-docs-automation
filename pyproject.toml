[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gost-docs-automation"
version = "0.1.0"
description = "Грязные CSV/Excel-выгрузки → ведомость покупных изделий по ГОСТ 2.106-96"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1,<4.0",
    "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "ruff>=0.17,<0.18"]

[project.scripts]
gost-docs = "gost_docs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
