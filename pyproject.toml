[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gost-docs-automation"
version = "0.1.0"
description = "Грязные CSV/Excel-выгрузки → таблица ВП в DOCX (6 граф формы 5, ГОСТ Р 2.106-2019)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1,<4.0",
    "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
ocr = [
    "pypdfium2>=4.30,<6",
    "Pillow>=10.0,<12",
    "pytesseract>=0.3.10,<0.4",
]
ocr-windows = [
    "pypdfium2>=4.30,<6",
    "winrt-runtime>=2.0",
    "winrt-Windows.Media.Ocr>=2.0",
    "winrt-Windows.Graphics.Imaging>=2.0",
    "winrt-Windows.Storage>=2.0",
    "winrt-Windows.Storage.Streams>=2.0",
    "winrt-Windows.Foundation>=2.0",
    "winrt-Windows.Globalization>=2.0",
]
web = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.17,<0.18",
    "httpx>=0.27,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.scripts]
gost-docs = "gost_docs.cli:main"
gost-docs-web = "gost_docs.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gost_docs.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
